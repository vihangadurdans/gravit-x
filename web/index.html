<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAVIT-X | Home</title>
    
    <!-- FAVICON (Uses your logo) -->
    <link rel="icon" type="image/jpeg" href="logo.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --bg-color: #f4f4f9;
            --text-main: #111111;
            --text-muted: #555555;
            --accent-purple: #6a1b9a;
            --accent-glow: #9c27b0;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(106, 27, 154, 0.15);
            --nav-bg: rgba(244, 244, 249, 0.85);
            --font-head: 'Syne', sans-serif;
            --font-body: 'Space Grotesk', sans-serif;
            --transition-speed: 0.6s;
        }

        body.dark-mode {
            --bg-color: #0a0012;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --accent-purple: #b44aff;
            --accent-glow: #d580ff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --nav-bg: rgba(10, 0, 18, 0.85);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        html { scroll-behavior: smooth; background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-body); transition: background-color var(--transition-speed), color var(--transition-speed); overflow-x: hidden; }

        /* --- DARK MODE SWEEP EFFECT --- */
        body::before {
            content: ''; position: fixed; top: 50%; left: 50%; width: 0; height: 0;
            background: radial-gradient(circle, #0a0012 0%, #000 100%);
            z-index: -2; transform: translate(-50%, -50%); border-radius: 50%;
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1), height 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        body.dark-mode::before { width: 300vw; height: 300vw; }

        /* --- GALAXY CANVAS --- */
        #galaxy-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; opacity: 0.3; pointer-events: none; transition: opacity 0.5s;
        }
        body.dark-mode #galaxy-canvas { opacity: 0.6; }

        /* --- CUSTOM CURSOR --- */
        .cursor-dot, .cursor-outline {
            position: fixed; top: 0; left: 0; transform: translate(-50%, -50%);
            border-radius: 50%; z-index: 9999; pointer-events: none;
        }
        .cursor-dot { width: 6px; height: 6px; background: var(--accent-purple); box-shadow: 0 0 10px var(--accent-purple); }
        .cursor-outline { width: 40px; height: 40px; border: 1px solid var(--accent-purple); transition: width 0.2s, height 0.2s, background 0.2s; }
        .cursor-outline.hovering { width: 70px; height: 70px; background: rgba(106, 27, 154, 0.1); backdrop-filter: blur(3px); }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1200px; padding: 15px 40px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; background: var(--nav-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 50px;
            transition: all 0.5s;
        }
        nav:hover { box-shadow: 0 10px 30px rgba(106, 27, 154, 0.1); }
        
        .nav-logo img { height: 50px; width: auto; transition: filter 0.5s, transform 0.3s; }
        .nav-logo img:hover { transform: rotate(10deg) scale(1.1); }
        body.dark-mode .nav-logo img { filter: invert(1) drop-shadow(0 0 10px var(--accent-purple)); }

        .nav-links { display: flex; gap: 40px; align-items: center; }
        .nav-links a {
            color: var(--text-main); text-decoration: none; font-size: 0.85rem;
            letter-spacing: 2px; text-transform: uppercase; position: relative; transition: color 0.3s;
        }
        .nav-links a::after {
            content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px;
            background: var(--accent-purple); transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

        .theme-toggle {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: var(--text-main); width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.3s;
        }
        .theme-toggle:hover { background: var(--accent-purple); color: #fff; transform: scale(1.1) rotate(180deg); }
        .theme-toggle svg { width: 20px; height: 20px; fill: currentColor; }

        /* --- MOBILE HAMBURGER MENU --- */
        .hamburger {
            display: none; flex-direction: column; gap: 5px; cursor: pointer; z-index: 1001;
        }
        .hamburger span { width: 25px; height: 2px; background: var(--text-main); transition: all 0.3s; }
        
        .mobile-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: var(--nav-bg); backdrop-filter: blur(20px);
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.4s;
        }
        .mobile-menu.active { opacity: 1; pointer-events: all; }
        .mobile-menu a { color: var(--text-main); font-size: 1.5rem; text-decoration: none; text-transform: uppercase; letter-spacing: 3px; }

        /* --- HERO SECTION --- */
        #hero {
            min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 160px 5vw 50px; position: relative;
        }

        .hero-image-container {
            width: 100%; max-width: 1100px; height: 60vh;
            border-radius: 20px; overflow: hidden; position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            transform-style: preserve-3d; transition: transform 0.5s, box-shadow 0.5s;
        }
        .hero-image-container:hover {
            transform: perspective(1000px) rotateX(4deg) rotateY(-4deg) scale(1.02);
            box-shadow: 0 30px 60px rgba(106, 27, 154, 0.3);
        }

        .hero-image-container img {
            width: 100%; height: 100%; object-fit: cover; object-position: center 20%;
            display: block; transition: transform 0.8s;
            filter: grayscale(80%) brightness(0.8);
        }
        .hero-image-container:hover img { filter: grayscale(0%) brightness(1); }

        .spotlight {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
            background: radial-gradient(circle 200px at var(--x) var(--y), transparent 0%, rgba(0,0,0,0.6) 100%);
            mix-blend-mode: multiply; transition: opacity 0.3s;
        }

        .hero-title {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            font-family: var(--font-head); font-size: clamp(3rem, 10vw, 10rem);
            font-weight: 800; letter-spacing: 8px; line-height: 1;
            color: var(--text-main); z-index: 3; white-space: nowrap;
            text-shadow: 0 10px 30px rgba(0,0,0,0.2);
            pointer-events: none; padding: 0 20px;
            animation: slideUp 1s 0.2s forwards; opacity: 0;
        }
        body.dark-mode .hero-title {
            text-shadow: 0 0 60px rgba(106, 27, 154, 0.8), 0 0 20px rgba(180, 74, 255, 0.5);
        }

        /* --- MUSIC SECTION --- */
        #music-section { padding: 100px 10vw; position: relative; z-index: 2; }
        .section-title {
            font-family: var(--font-head); font-size: 3rem; margin-bottom: 50px;
            text-transform: uppercase; letter-spacing: 2px;
            display: flex; align-items: center; gap: 20px; color: var(--text-main);
        }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }

        .music-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .music-player {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 40px; border-radius: 20px; backdrop-filter: blur(20px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden;
        }
        .music-player:hover {
            transform: translateY(-10px);
            border-color: var(--accent-purple);
            box-shadow: 0 20px 40px rgba(106, 27, 154, 0.2);
        }

        .music-player h3 { font-family: var(--font-head); font-size: 2rem; margin-bottom: 10px; color: var(--text-main); }
        .music-player p { color: var(--text-muted); margin-bottom: 30px; }

        .player-controls { display: flex; align-items: center; gap: 20px; }
        .play-btn {
            width: 60px; height: 60px; border-radius: 50%; background: var(--accent-purple);
            border: none; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
        }
        .play-btn:hover { transform: scale(1.1); box-shadow: 0 0 25px var(--accent-glow); }
        .play-btn svg { width: 20px; fill: #fff; margin-left: 4px; }

        .visualizer { display: flex; gap: 3px; height: 40px; align-items: flex-end; }
        .visualizer .bar {
            width: 4px; background: var(--accent-purple); border-radius: 2px;
            height: 10%; transition: height 0.1s;
        }
        .music-player:hover .visualizer .bar { animation: bounce 0.8s infinite alternate ease-in-out; }
        .visualizer .bar:nth-child(1) { animation-delay: 0.0s; height: 30%; }
        .visualizer .bar:nth-child(2) { animation-delay: 0.1s; height: 60%; }
        .visualizer .bar:nth-child(3) { animation-delay: 0.2s; height: 40%; }
        .visualizer .bar:nth-child(4) { animation-delay: 0.3s; height: 80%; }
        .visualizer .bar:nth-child(5) { animation-delay: 0.4s; height: 50%; }
        .visualizer .bar:nth-child(6) { animation-delay: 0.5s; height: 90%; }
        .visualizer .bar:nth-child(7) { animation-delay: 0.6s; height: 20%; }

        /* --- CONTACT SECTION --- */
        #contact-section { padding: 100px 10vw 150px; position: relative; z-index: 2; }
        .contact-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .contact-grid a {
            color: var(--text-muted); text-decoration: none; font-size: 1rem;
            padding: 15px 30px; border: 1px solid var(--glass-border); border-radius: 15px;
            backdrop-filter: blur(10px); transition: all 0.4s;
        }
        .contact-grid a:hover {
            color: #fff; background: var(--accent-purple);
            border-color: var(--accent-purple); transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        /* --- ANIMATIONS --- */
        @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 40px); } to { opacity: 1; transform: translate(-50%, 0); } }
        @keyframes bounce { 0% { height: 10%; } 100% { height: 100%; } }

        .reveal { opacity: 0; transform: translateY(60px) scale(0.95); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0) scale(1); }

        /* =========================================
           MOBILE RESPONSIVENESS (CRUCIAL)
           ========================================= */
        @media (max-width: 900px) {
            /* Disable custom cursor on touch devices */
            * { cursor: auto; }
            .cursor-dot, .cursor-outline { display: none; }

            /* Navigation */
            .nav-links { display: none; }
            .hamburger { display: flex; }
            nav { padding: 15px 25px; width: 90%; top: 20px; }
            .nav-logo img { height: 40px; }

            /* Hero Section */
            #hero { padding: 120px 5vw 40px; min-height: auto; }
            .hero-image-container { height: 45vh; }
            .hero-title { font-size: 3rem; letter-spacing: 4px; bottom: 10px; position: relative; margin-top: -20px; }
            
            /* Music Section */
            #music-section { padding: 60px 5vw; }
            .section-title { font-size: 2rem; margin-bottom: 30px; }
            .music-grid { grid-template-columns: 1fr; gap: 20px; }
            .music-player { padding: 25px; }
            .music-player h3 { font-size: 1.5rem; }
            
            /* Contact Section */
            #contact-section { padding: 60px 5vw 100px; }
            .contact-grid { flex-direction: column; gap: 15px; }
            .contact-grid a { text-align: center; width: 100%; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>

        </button>
    </nav>

    <section id="hero">
        <div class="hero-image-container reveal">
            <img src="band.jpg" alt="GRAVIT-X Band" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1000&auto=format&fit=crop'">

        </div>

    <script>
        // --- 1. THEME TOGGLE ---
        const themeBtn = document.getElementById('theme-btn');
        const themeBtnMobile = document.getElementById('theme-btn-mobile');
        const themeIcon = document.getElementById('theme-icon');
        const themeIconMobile = document.getElementById('theme-icon-mobile');
        const body = document.body;

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') { 
            body.classList.add('dark-mode'); 
            updateIcon(true); 
        }

        function toggleTheme() {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateIcon(isDark);
        }

        themeBtn.addEventListener('click', toggleTheme);
        themeBtnMobile.addEventListener('click', toggleTheme);

        function updateIcon(isDark) {
            const sunPath = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
            const moonPath = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
            
            if (isDark) {
                themeIcon.innerHTML = sunPath;
                if(themeIconMobile) themeIconMobile.innerHTML = sunPath;
            } else {
                themeIcon.innerHTML = moonPath;
                if(themeIconMobile) themeIconMobile.innerHTML = moonPath;
            }
        }

        // --- 2. MOBILE MENU TOGGLE ---
        function toggleMenu() {
            document.getElementById('mobile-menu').classList.toggle('active');
        }

        // --- 3. CUSTOM CURSOR ---
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');
        const links = document.querySelectorAll('a, button, .music-player');

        // Only activate custom cursor on non-touch devices
        if (window.matchMedia("(pointer: fine)").matches) {
            window.addEventListener('mousemove', (e) => {
                const posX = e.clientX; const posY = e.clientY;
                cursorDot.style.left = `${posX}px`; cursorDot.style.top = `${posY}px`;
                cursorOutline.animate({ left: `${posX}px`, top: `${posY}px` }, { duration: 500, fill: "forwards" });
            });

            links.forEach(link => {
                link.addEventListener('mouseenter', () => cursorOutline.classList.add('hovering'));
                link.addEventListener('mouseleave', () => cursorOutline.classList.remove('hovering'));
            });
        }

        // --- 4. SPOTLIGHT EFFECT ON HERO IMAGE ---
        const heroContainer = document.querySelector('.hero-image-container');
        const spotlight = document.getElementById('spotlight');

        if (window.matchMedia("(pointer: fine)").matches) {
            heroContainer.addEventListener('mousemove', (e) => {
                const rect = heroContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                spotlight.style.setProperty('--x', `${x}px`);
                spotlight.style.setProperty('--y', `${y}px`);
                spotlight.style.opacity = '1';
            });
            heroContainer.addEventListener('mouseleave', () => {
                spotlight.style.opacity = '0';
            });
        }

        // --- 5. SCROLL REVEAL ---
        function triggerReveal() {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(reveal => {
                const windowHeight = window.innerHeight;
                const elementTop = reveal.getBoundingClientRect().top;
                if (elementTop < windowHeight - 150) reveal.classList.add('active');
                else reveal.classList.remove('active');
            });
        }
        window.addEventListener('scroll', triggerReveal);
        window.addEventListener('load', triggerReveal);

        // --- 6. INTERACTIVE GALAXY BACKGROUND ---
        const canvas = document.getElementById('galaxy-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        let mouse = { x: -1000, y: -1000 };

        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            const particleCount = Math.floor(width * height / 6000);
            
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width, y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.5,
                    baseSpeedX: (Math.random() - 0.5) * 0.4, baseSpeedY: (Math.random() - 0.5) * 0.4,
                    speedX: 0, speedY: 0,
                    opacity: Math.random() * 0.5 + 0.1, baseOpacity: Math.random() * 0.5 + 0.1
                });
            }
        }

        function drawGalaxy() {
            ctx.clearRect(0, 0, width, height);
            const isDark = document.body.classList.contains('dark-mode');
            const color = isDark ? '180, 74, 255' : '106, 27, 154';

            particles.forEach(p => {
                const dx = p.x - mouse.x; const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxDist = 200;

                if (dist < maxDist) {
                    const force = (maxDist - dist) / maxDist;
                    const angle = Math.atan2(dy, dx);
                    p.speedX -= Math.cos(angle) * force * 2;
                    p.speedY -= Math.sin(angle) * force * 2;
                    p.opacity = p.baseOpacity + force * 0.5;
                } else {
                    p.opacity = p.baseOpacity;
                }

                p.speedX *= 0.95; p.speedY *= 0.95;
                p.x += p.baseSpeedX + p.speedX; p.y += p.baseSpeedY + p.speedY;

                if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;

                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${color}, ${p.opacity})`; ctx.fill();

                particles.forEach(p2 => {
                    const dx2 = p.x - p2.x; const dy2 = p.y - p2.y;
                    const dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
                    if (dist2 < 120) {
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(${color}, ${0.15 * (1 - dist2/120)})`; ctx.lineWidth = 0.5; ctx.stroke();
                    }
                });
            });
            requestAnimationFrame(drawGalaxy);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas(); drawGalaxy();
    </script>
</body>
</html>
