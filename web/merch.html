<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAVIT-X | Merch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f4f9; --text-main: #111111; --text-muted: #555555;
            --accent-purple: #6a1b9a; --accent-glow: #9c27b0;
            --glass-bg: rgba(255, 255, 255, 0.6); --glass-border: rgba(106, 27, 154, 0.15);
            --nav-bg: rgba(244, 244, 249, 0.85);
            --font-head: 'Syne', sans-serif; --font-body: 'Space Grotesk', sans-serif;
        }
        body.dark-mode {
            --bg-color: #0a0012; --text-main: #f0f0f0; --text-muted: #aaaaaa;
            --accent-purple: #b44aff; --accent-glow: #d580ff;
            --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08);
            --nav-bg: rgba(10, 0, 18, 0.85);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        html { scroll-behavior: smooth; background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-body); transition: background-color 0.5s, color 0.5s; overflow-x: hidden; }
        
        #galaxy-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.4; pointer-events: none; }

        .cursor-dot, .cursor-outline { position: fixed; top: 0; left: 0; transform: translate(-50%, -50%); border-radius: 50%; z-index: 9999; pointer-events: none; }
        .cursor-dot { width: 6px; height: 6px; background: var(--accent-purple); box-shadow: 0 0 10px var(--accent-purple); }
        .cursor-outline { width: 40px; height: 40px; border: 1px solid var(--accent-purple); transition: width 0.2s, height 0.2s, background 0.2s; }
        .cursor-outline.hovering { width: 70px; height: 70px; background: rgba(106, 27, 154, 0.1); backdrop-filter: blur(3px); }

        nav { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 1200px; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; background: var(--nav-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 50px; transition: all 0.5s; }
        .nav-logo img { height: 50px; width: auto; transition: filter 0.5s; }
        body.dark-mode .nav-logo img { filter: invert(1) drop-shadow(0 0 10px var(--accent-purple)); }
        .nav-links { display: flex; gap: 40px; align-items: center; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; position: relative; transition: color 0.3s; }
        .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--accent-purple); transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
        .theme-toggle { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s; }
        .theme-toggle:hover { background: var(--accent-purple); color: #fff; transform: scale(1.1) rotate(180deg); }

        section { padding: 180px 10vw 100px; min-height: 100vh; }
        h1 { font-family: var(--font-head); font-size: 5rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: -2px; }
        
        .merch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; margin-top: 60px; perspective: 1000px; }
        
        .merch-card { 
            background: var(--glass-bg); border: 1px solid var(--glass-border); 
            border-radius: 20px; padding: 30px; text-align: center; backdrop-filter: blur(10px); 
            transition: transform 0.1s ease-out, box-shadow 0.3s, border-color 0.3s; 
            position: relative; overflow: hidden; transform-style: preserve-3d;
        }
        .merch-card:hover { border-color: var(--accent-purple); box-shadow: 0 20px 50px rgba(106, 27, 154, 0.3); }
        
        .merch-img-placeholder { 
            width: 100%; height: 300px; 
            background: linear-gradient(45deg, rgba(106, 27, 154, 0.1), rgba(106, 27, 154, 0.05)); 
            border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; 
            color: var(--text-muted); font-size: 0.8rem; letter-spacing: 2px; 
            position: relative; overflow: hidden; border: 1px dashed var(--glass-border); 
        }
        
        /* Holographic Shine */
        .merch-img-placeholder::after { 
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; 
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.6), transparent); 
            transform: skewX(-20deg); transition: 0.5s; 
        }
        .merch-card:hover .merch-img-placeholder::after { left: 150%; }

        .merch-card h3 { font-family: var(--font-head); font-size: 1.5rem; margin-bottom: 10px; transform: translateZ(30px); }
        .merch-card .price { color: var(--accent-purple); font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; display: block; transform: translateZ(20px); }
        
        .btn { display: inline-block; padding: 15px 35px; border: 1px solid var(--accent-purple); background: transparent; color: var(--accent-purple); text-decoration: none; font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; border-radius: 50px; transition: all 0.4s; position: relative; overflow: hidden; transform: translateZ(40px); }
        .btn:hover { background: var(--accent-purple); color: #fff; box-shadow: 0 0 20px var(--accent-glow); }

        .reveal { opacity: 0; transform: translateY(60px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        @media (max-width: 900px) { .nav-links { display: none; } h1 { font-size: 3rem; } nav { padding: 10px 20px; width: 95%; } }
    </style>
</head>
<body>
    <canvas id="galaxy-canvas"></canvas>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav>
        <div class="nav-logo"><img src="logo.jpg" alt="GRAVIT-X Logo" onerror="this.style.display='none'"></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="merch.html" class="active">Merch</a>
            <a href="about.html">About</a>
            <button class="theme-toggle" id="theme-btn" aria-label="Toggle Dark Mode">
                <svg id="theme-icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
            </button>
        </div>
    </nav>

    <section>
        <h1 class="reveal">Merch</h1>
        <p class="reveal" style="color: var(--text-muted); max-width: 600px; font-size: 1.2rem;">Limited edition gear for the upcoming tour. Designed in zero gravity.</p>
        
        <div class="merch-grid">
            <div class="merch-card reveal">
                <div class="merch-img-placeholder">HOODIE IMAGE</div>
                <h3>Anti-Grav Hoodie</h3>
                <span class="price">$65.00</span>
                <a href="#" class="btn">Add to Cart</a>
            </div>
            <div class="merch-card reveal">
                <div class="merch-img-placeholder">TEE IMAGE</div>
                <h3>Event Horizon Tee</h3>
                <span class="price">$35.00</span>
                <a href="#" class="btn">Add to Cart</a>
            </div>
            <div class="merch-card reveal">
                <div class="merch-img-placeholder">VINYL IMAGE</div>
                <h3>Zero-G Vinyl</h3>
                <span class="price">$45.00</span>
                <a href="#" class="btn">Add to Cart</a>
            </div>
        </div>
    </section>

    <script>
        // --- THEME TOGGLE ---
        const themeBtn = document.getElementById('theme-btn');
        const themeIcon = document.getElementById('theme-icon');
        const body = document.body;
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') { body.classList.add('dark-mode'); updateIcon(true); }
        themeBtn.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateIcon(isDark);
        });
        function updateIcon(isDark) {
            if (isDark) { themeIcon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>'; }
            else { themeIcon.innerHTML = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>'; }
        }

        // --- CURSOR ---
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');
        const links = document.querySelectorAll('a, button, .merch-card');
        window.addEventListener('mousemove', (e) => {
            const posX = e.clientX; const posY = e.clientY;
            cursorDot.style.left = `${posX}px`; cursorDot.style.top = `${posY}px`;
            cursorOutline.animate({ left: `${posX}px`, top: `${posY}px` }, { duration: 500, fill: "forwards" });
        });
        links.forEach(link => {
            link.addEventListener('mouseenter', () => cursorOutline.classList.add('hovering'));
            link.addEventListener('mouseleave', () => cursorOutline.classList.remove('hovering'));
        });

        // --- 3D TILT EFFECT ON MERCH CARDS ---
        const cards = document.querySelectorAll('.merch-card');
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -15; // Max tilt 15deg
                const rotateY = ((x - centerX) / centerX) * 15;
                
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            });
            
            card.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
                card.style.transition = 'transform 0.5s ease-out'; // Smooth return
            });
            
            card.addEventListener('mouseenter', () => {
                card.style.transition = 'transform 0.1s ease-out'; // Fast response
            });
        });

        // --- SCROLL REVEAL ---
        function triggerReveal() {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(reveal => {
                const windowHeight = window.innerHeight;
                const elementTop = reveal.getBoundingClientRect().top;
                if (elementTop < windowHeight - 150) reveal.classList.add('active');
                else reveal.classList.remove('active');
            });
        }
        window.addEventListener('scroll', triggerReveal);
        window.addEventListener('load', triggerReveal);

        // --- GALAXY BACKGROUND ---
        const canvas = document.getElementById('galaxy-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            const particleCount = Math.floor(width * height / 8000);
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width, y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.5,
                    speedX: (Math.random() - 0.5) * 0.4, speedY: (Math.random() - 0.5) * 0.4,
                    opacity: Math.random() * 0.5 + 0.1
                });
            }
        }
        function drawGalaxy() {
            ctx.clearRect(0, 0, width, height);
            const isDark = document.body.classList.contains('dark-mode');
            const color = isDark ? '180, 74, 255' : '106, 27, 154';
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${color}, ${p.opacity})`; ctx.fill();
                particles.forEach(p2 => {
                    const dx = p.x - p2.x; const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(${color}, ${0.1 * (1 - dist/120)})`; ctx.lineWidth = 0.5; ctx.stroke();
                    }
                });
            });
            requestAnimationFrame(drawGalaxy);
        }
        window.addEventListener('resize', initCanvas);
        initCanvas(); drawGalaxy();
    </script>
</body>
</html>
